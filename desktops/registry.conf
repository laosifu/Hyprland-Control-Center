# Desktop Registry
# Lists all available desktop packages.
# Each entry maps a desktop ID to its manifest path.
# Format: DESKTOP_REGISTRY_<ID>="<relative-path>"
#
# The registry is the single source of truth for discovering
# desktops that HCC can install.

