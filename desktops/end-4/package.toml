name = "end-4 illogical-impulse"
id = "end-4"
version = "1.0"
author = "end-4"
description = "Usability-first Hyprland dotfiles with Quickshell widget system, AI integration, and Material Design theming"
supported_distros = ["arch", "endeavouros", "cachyos"]
reboot_required = true

[packages]
required = [
    "hyprland", "kitty", "fish", "starship", "fuzzel", "wlogout",
    "hyprlock", "hypridle", "hyprsunset", "wl-clipboard", "brightnessctl",
    "slurp", "jq", "bc", "curl", "wget", "ripgrep", "cmake", "eza",
    "fontconfig", "wireplumber", "pipewire-pulse", "playerctl", "upower",
    "glib2", "imagemagick", "dolphin", "networkmanager",
    "plasma-nm", "polkit-kde-agent", "systemsettings",
    "xdg-desktop-portal", "xdg-desktop-portal-hyprland",
    "xdg-desktop-portal-kde", "xdg-desktop-portal-gtk",
    "gnome-keyring",
    "otf-space-grotesk", "ttf-jetbrains-mono-nerd",
    "ttf-readex-pro", "ttf-rubik-vf", "ttf-twemoji",
    "qt6-base", "qt6-declarative", "qt6-5compat",
    "qt6-imageformats", "qt6-multimedia", "qt6-positioning",
    "qt6-svg", "qt6-tools", "qt6-wayland",
    "kirigami", "kdialog", "syntax-highlighting",
    "vulkan-headers", "libdrm", "mesa", "cava", "libqalculate",
    "ddcutil", "pavucontrol-qt", "swappy", "tesseract",
    "tesseract-data-eng", "wf-recorder", "cliphist",
    "xdg-user-dirs", "rsync", "gobject-introspection",
    "gtk4", "libadwaita", "libsoup3", "libportal-gtk4",
    "breeze", "hyprpicker", "hyprshot"
]
aur = [
    "quickshell-git", "matugen-bin", "adw-gtk-theme-git",
    "ttf-material-symbols-variable-git", "songrec",
    "translate-shell", "wtype", "ydotool", "darkly-bin", "go-yq"
]

[config]
payload_root = "."
install_path = "~"
copy_items = []

[git]
repositories = [
    { url = "https://github.com/end-4/dots-hyprland.git", path = "~/.config/end-4-dots" }
]

[hooks]
post_install = "hooks/post-install.sh"
